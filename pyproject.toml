[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsd-csv"
version = "1.0.0"
description = "JSD-CSV: Jio Saavn Downloader - (with) CSV. High-performance MP3 downloader with high-res metadata, YouTube Music fallback matching, customizable naming, and CSV exports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "JSD-CSV Team" }
]
keywords = ["jiosaavn", "downloader", "csv", "ytmusic", "mp3", "music-downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "mutagen>=1.47.0",
    "yt-dlp>=2024.0.0",
    "ytmusicapi>=1.7.0",
    "pycryptodome>=3.20.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
jsd-csv = "jsd_csv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jsd_csv*"]
